<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commander Bag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">

    <header class="page">
      <div>
        <h1>Commander <span>Bag</span></h1>
        <div class="subtitle">Helping you decide which decks to bring.</div>
      </div>
      <div class="header-actions">
        <button class="btn" id="exportBtn">Export</button>
        <button class="btn" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button class="btn primary" id="addDeckBtn">+ Add deck</button>
      </div>
    </header>

    <section class="bag-panel">
      <div class="bag-toprow">
        <div class="bag-label">The Bag</div>
        <div class="slot-count">
          Slots
          <div class="stepper">
            <button id="slotMinus">–</button>
            <span id="slotCountLabel">4</span>
            <button id="slotPlus">+</button>
          </div>
        </div>
        <div class="slider-row">
          <span>Variety</span>
          <input type="range" id="varietySlider" min="0" max="100" value="60">
          <span>Recency</span>
        </div>
        <button class="btn small" id="markPlayedBtn">Mark bag played today</button>
      </div>
      <div class="bag-slots" id="bagSlots"></div>
    </section>

    <section class="controls">
      <div class="filter-chips" id="filterChips"></div>
      <div class="sort-pills" id="sortPills">
        <button data-sort="recommended" class="active">Recommended</button>
        <button data-sort="az">A–Z</button>
        <button data-sort="bracket">Bracket</button>
      </div>
    </section>

    <section class="deck-grid" id="deckGrid"></section>
    <div class="empty-state" id="emptyState" style="display:none;">
      No decks yet. Add your first one to get started.
      <br><button class="btn primary" id="emptyAddBtn">+ Add deck</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
